name: mirror-nz-altmedia

# Runs ~40 minutes before the daily news brief (which runs 11:45 UTC),
# plus on demand. GitHub-hosted runners have unrestricted internet access,
# which is the whole point of this repo.
on:
  schedule:
    - cron: "5 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds
        run: python3 fetch.py

      - name: Commit if changed
        run: |
          git config user.name "nz-altmedia-mirror"
          git config user.email "actions@github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "mirror: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
